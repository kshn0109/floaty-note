<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkwell</title>
    <!--
      알림 토스트(시안 T2). **`index.html`이 아닌 자기 페이지인 이유**는 `ghost.html`과
